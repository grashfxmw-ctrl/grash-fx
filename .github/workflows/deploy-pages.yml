name: Deploy GRASH FX clean website to GitHub Pages

on:
  push:
    branches:
      - grash-fx-clean-website
    paths:
      - "index.html"
      - "login.html"
      - "register.html"
      - "client-dashboard.html"
      - "admin-dashboard.html"
      - "admin.html"
      - "assets/**"
      - ".github/workflows/deploy-pages.yml"
      - "supabase/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean project
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare clean root website
        run: |
          mkdir -p "$RUNNER_TEMP/grash-site"
          cp index.html login.html register.html client-dashboard.html admin-dashboard.html admin.html "$RUNNER_TEMP/grash-site/"
          mkdir -p "$RUNNER_TEMP/grash-site/assets"
          cp assets/grash-fx-logo.svg "$RUNNER_TEMP/grash-site/assets/"
          touch "$RUNNER_TEMP/grash-site/.nojekyll"

      - name: Upload clean root website
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/grash-site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
