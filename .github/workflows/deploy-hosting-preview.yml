name: Deploy GRASH FX Supabase preview to GitHub Pages

on:
  push:
    branches:
      - supabase-registration-preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: grash-fx-pages-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload registration site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
