name: Deploy GRASH FX registration preview

on:
  push:
    branches:
      - supabase-registration-preview
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/420001022752/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-firebase-deployer@grashfx.iam.gserviceaccount.com

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy isolated Hosting preview only
        run: firebase hosting:channel:deploy supabase-registration-preview --expires 7d --project grashfx --non-interactive
