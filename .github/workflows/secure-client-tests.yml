name: GRASH FX production website regression tests

on:
  pull_request:
    paths:
      - "index.html"
      - "login.html"
      - "register.html"
      - "client-dashboard.html"
      - "admin-dashboard.html"
      - "admin.html"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "tests/**"
      - ".github/workflows/secure-client-tests.yml"
  push:
    branches:
      - grash-fx-clean-website
    paths:
      - "index.html"
      - "login.html"
      - "register.html"
      - "client-dashboard.html"
      - "admin-dashboard.html"
      - "admin.html"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "tests/**"
      - ".github/workflows/secure-client-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-site-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out active clean website
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify deployed root website files
        run: |
          test -s index.html
          test -s login.html
          test -s register.html
          test -s client-dashboard.html
          test -s admin-dashboard.html
          test -s admin.html
          test -s supabase/functions/account-api/index.ts
      - name: Run production website regression tests
        run: node --test tests/secure-client.test.mjs
