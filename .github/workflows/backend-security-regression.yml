name: Backend security regression tests

on:
  push:
    branches: [secure-backend-migration]
  pull_request:
    branches: [main]

jobs:
  backend-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test backend security invariants
        run: node --test tests/functions-security.test.mjs
