name: Security migration checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [secure-backend-migration]

jobs:
  backend-and-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root test dependencies
        run: npm install
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install
      - name: Check staged frontend adapter syntax
        run: node --check frontend/secure-client.js
      - name: Test secure preview page
        run: node --test tests/secure-preview.test.mjs
      - name: Test secure frontend adapter flows
        run: node --test tests/secure-client.test.mjs
      - name: Test staging admin review preview
        run: node --test tests/admin-preview.test.mjs
      - name: Check backend JavaScript syntax
        working-directory: functions
        run: npm run check
      - name: Test Realtime Database rules in emulator
        run: npm run test:rules
