<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRASH FX - Trading & Investment Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Firebase App & Realtime Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#070a11',
              card: '#111827',
              cardBorder: '#1f2937',
              gold: '#eab308',
              goldHover: '#ca8a04',
              accent: '#3b82f6'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #070a11; color: #f3f4f6; font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #111827; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    .gold-gradient { background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%); }
    .gold-text-gradient { background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between custom-scrollbar bg-[#070a11] text-gray-100">

  <!-- TOP HEADER -->
  <header class="bg-gray-950 border-b border-gray-800 text-xs py-2 px-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Global Cloud Sync Online
        </span>
      </div>
      <button id="adminNavBtn" onclick="openAdminModal()" class="hidden text-xs text-yellow-500 border border-yellow-500/30 px-2.5 py-1 rounded-md hover:bg-yellow-500/10 transition flex items-center gap-1 relative">
        <i class="fas fa-shield-alt"></i> Admin Control Panel
        <span id="adminLiveBadge" class="hidden absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full animate-ping"></span>
      </button>
    </div>
  </header>

  <!-- NAVIGATION -->
  <nav class="bg-[#111827] border-b border-gray-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('dashboard')">
          <div class="w-10 h-10 gold-gradient rounded-xl flex items-center justify-center shadow-lg shadow-yellow-500/20">
            <i class="fas fa-chart-line text-[#070a11] text-xl font-black"></i>
          </div>
          <div>
            <span class="text-xl font-black tracking-wider text-white">GRASH <span class="gold-text-gradient">FX</span></span>
            <span class="block text-[10px] tracking-widest text-gray-400 uppercase font-semibold">Trading & Investment</span>
          </div>
        </div>

        <div class="hidden lg:flex items-center space-x-3">
          <button onclick="switchTab('dashboard')" class="text-gray-300 hover:text-yellow-400 px-3 py-2 rounded-md font-medium text-xs flex items-center gap-1.5"><i class="fas fa-chart-pie"></i> Dashboard</button>
          <button onclick="switchTab('plans')" class="text-gray-300 hover:text-yellow-400 px-3 py-2 rounded-md font-medium text-xs flex items-center gap-1.5"><i class="fas fa-layer-group"></i> Investment Plans</button>
          <button onclick="switchTab('referral')" class="text-gray-300 hover:text-yellow-400 px-3 py-2 rounded-md font-medium text-xs flex items-center gap-1.5"><i class="fas fa-users-viewfinder text-yellow-500"></i> Refer & Earn</button>
          <button onclick="switchTab('profile')" class="text-gray-300 hover:text-yellow-400 px-3 py-2 rounded-md font-medium text-xs flex items-center gap-1.5"><i class="fas fa-user-gear text-yellow-400"></i> Profile</button>
        </div>

        <div class="flex items-center gap-3">
          <div id="userInfoHeader" class="hidden flex items-center gap-3">
            <span id="userHeaderName" class="text-xs font-bold text-gray-200">User</span>
            <button onclick="logoutUser()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 p-2 rounded-lg text-xs" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
          </div>
          <button id="authBtnNav" onclick="openAuthModal()" class="gold-gradient text-gray-950 font-bold px-4 py-2 rounded-lg text-xs shadow-md">Login / Sign Up</button>
        </div>
      </div>
    </div>
  </nav>

  <div id="notificationArea" class="fixed top-20 right-4 z-50 flex flex-col gap-2 max-w-sm"></div>

  <!-- MAIN BODY -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
    <!-- DASHBOARD TAB -->
    <section id="dashboardTab" class="space-y-8">
      <div class="bg-gradient-to-r from-gray-900 via-[#111827] to-gray-900 border border-gray-800 p-6 rounded-2xl shadow-xl flex justify-between items-center">
        <div>
          <h1 class="text-2xl font-extrabold text-white">Welcome Back, <span id="dashUserName" class="gold-text-gradient">Investor</span></h1>
          <p class="text-xs text-gray-400 mt-1">Global Database Sync Active across all devices.</p>
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-[#111827] border border-gray-800 p-6 rounded-2xl">
          <p class="text-xs font-medium text-gray-400 uppercase">Available Balance</p>
          <div class="text-3xl font-black text-white mt-2" id="dashBalance">$0.00</div>
        </div>
        <div class="bg-[#111827] border border-gray-800 p-6 rounded-2xl">
          <p class="text-xs font-medium text-gray-400 uppercase">Total Profit</p>
          <div class="text-3xl font-black text-emerald-400 mt-2" id="dashProfit">$0.00</div>
        </div>
        <div class="bg-[#111827] border border-gray-800 p-6 rounded-2xl">
          <p class="text-xs font-medium text-gray-400 uppercase">Referral Bonus</p>
          <div class="text-3xl font-black text-yellow-400 mt-2" id="dashRefBonus">$0.00</div>
        </div>
      </div>
    </section>

    <!-- REFERRAL TAB -->
    <section id="referralTab" class="hidden space-y-8">
      <div class="bg-[#111827] border border-gray-800 rounded-2xl p-8">
        <h2 class="text-3xl font-extrabold text-white mb-4">Refer & Earn <span class="gold-text-gradient">$5.00</span></h2>
        <div class="flex gap-2">
          <input type="text" id="refLinkInput" readonly class="flex-grow bg-gray-900 border border-gray-700 px-4 py-3 rounded-xl text-xs text-yellow-400 font-mono">
          <button onclick="copyRefLink()" class="gold-gradient text-gray-950 font-bold px-5 py-3 rounded-xl text-xs">Copy Link</button>
        </div>
      </div>
    </section>
  </main>

  <!-- AUTH MODAL -->
  <div id="authModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-[#111827] border border-gray-800 rounded-2xl max-w-md w-full p-6 relative">
      <button onclick="closeModal('authModal')" class="absolute top-4 right-4 text-gray-400">&times;</button>
      <div class="flex border-b border-gray-800 mb-6">
        <button id="tabBtnLogin" onclick="switchAuthTab('login')" class="w-1/2 py-3 text-sm font-bold text-yellow-400 border-b-2 border-yellow-400 text-center">Log In</button>
        <button id="tabBtnSignup" onclick="switchAuthTab('signup')" class="w-1/2 py-3 text-sm font-bold text-gray-400 text-center">Sign Up</button>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div><label class="block text-xs text-gray-300 mb-1">Email</label><input type="email" id="loginEmail" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white"></div>
        <div><label class="block text-xs text-gray-300 mb-1">Password</label><input type="password" id="loginPassword" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white"></div>
        <button type="submit" class="w-full gold-gradient text-gray-950 font-extrabold py-3.5 rounded-xl text-sm">Log In</button>
      </form>

      <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-4 hidden">
        <div><label class="block text-xs text-gray-300 mb-1">Full Name</label><input type="text" id="signupName" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white"></div>
        <div><label class="block text-xs text-gray-300 mb-1">Email</label><input type="email" id="signupEmail" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white"></div>
        <div><label class="block text-xs text-gray-300 mb-1">Password</label><input type="password" id="signupPassword" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white"></div>
        <button type="submit" class="w-full gold-gradient text-gray-950 font-extrabold py-3.5 rounded-xl text-sm">Create Account</button>
      </form>
    </div>
  </div>

  <!-- ADMIN PANEL MODAL -->
  <div id="adminPanelModal" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center hidden p-4 overflow-y-auto">
    <div class="bg-[#111827] border border-yellow-500/30 rounded-2xl max-w-4xl w-full p-6 relative">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-white">Worldwide Registered Users Admin Panel</h2>
        <button onclick="closeModal('adminPanelModal')" class="bg-gray-800 text-white px-3 py-1 rounded text-xs">Close</button>
      </div>
      <table class="w-full text-left text-xs text-gray-300">
        <thead class="bg-gray-950 uppercase">
          <tr><th class="p-2">Name</th><th class="p-2">Email</th><th class="p-2">Balance</th></tr>
        </thead>
        <tbody id="adminUsersTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // --- FIREBASE CONFIGURATION ---
    // Create a free project at firebase.google.com and paste your config here:
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "123456",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const ADMIN_EMAIL = "grashfxmw@gmail.com";
    let currentUser = JSON.parse(localStorage.getItem('grash_curr_user')) || null;
    let globalUsers = {};

    // Listen to real-time updates for ALL users worldwide from Firebase
    db.ref('users').on('value', (snapshot) => {
      globalUsers = snapshot.val() || {};
      renderApp();
      renderAdminTable();
    });

    function handleSignup(e) {
      e.preventDefault();
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value.trim();
      const userKey = email.replace(/[.#$[\]]/g, '_'); // Safe database key

      if (globalUsers[userKey]) {
        alert('An account with this email already exists.');
        return;
      }

      const newUser = {
        name: name,
        email: email,
        password: password,
        balance: 0.00,
        profit: 0.00,
        refBonus: 0.00,
        referralCode: "GRASH" + Math.floor(1000 + Math.random() * 9000)
      };

      // Save to cloud database instantly
      db.ref('users/' + userKey).set(newUser, (err) => {
        if (!err) {
          currentUser = newUser;
          localStorage.setItem('grash_curr_user', JSON.stringify(currentUser));
          closeModal('authModal');
          alert('Account created and synced globally!');
          renderApp();
        }
      });
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const userKey = email.replace(/[.#$[\]]/g, '_');

      const user = globalUsers[userKey];
      if (user && user.password === password) {
        currentUser = user;
        localStorage.setItem('grash_curr_user', JSON.stringify(currentUser));
        closeModal('authModal');
        alert(`Welcome back, ${user.name}!`);
        renderApp();
      } else {
        alert('Invalid login credentials or user not found in cloud database.');
      }
    }

    function logoutUser() {
      currentUser = null;
      localStorage.removeItem('grash_curr_user');
      renderApp();
      alert('Logged out.');
    }

    function renderApp() {
      if (currentUser) {
        const userKey = currentUser.email.replace(/[.#$[\]]/g, '_');
        if (globalUsers[userKey]) currentUser = globalUsers[userKey];

        document.getElementById('dashUserName').textContent = currentUser.name;
        document.getElementById('dashBalance').textContent = `$${parseFloat(currentUser.balance).toFixed(2)}`;
        document.getElementById('dashProfit').textContent = `$${parseFloat(currentUser.profit).toFixed(2)}`;
        document.getElementById('dashRefBonus').textContent = `$${parseFloat(currentUser.refBonus || 0).toFixed(2)}`;

        document.getElementById('userInfoHeader').classList.remove('hidden');
        document.getElementById('userHeaderName').textContent = currentUser.name;
        document.getElementById('authBtnNav').classList.add('hidden');

        // Show Admin Panel Button if admin email matches
        if (currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
          document.getElementById('adminNavBtn').classList.remove('hidden');
        }

        const refUrl = `${window.location.origin}${window.location.pathname}?ref=${currentUser.referralCode}`;
        document.getElementById('refLinkInput').value = refUrl;
      } else {
        document.getElementById('userInfoHeader').classList.add('hidden');
        document.getElementById('authBtnNav').classList.remove('hidden');
        document.getElementById('adminNavBtn').classList.add('hidden');
      }
    }

    function renderAdminTable() {
      const tbody = document.getElementById('adminUsersTableBody');
      if (!tbody) return;
      tbody.innerHTML = '';
      
      Object.values(globalUsers).forEach(u => {
        const tr = document.createElement('tr');
        tr.className = "border-b border-gray-800";
        tr.innerHTML = `
          <td class="p-2 font-bold text-white">${u.name}</td>
          <td class="p-2 text-gray-400">${u.email}</td>
          <td class="p-2 text-emerald-400">$${parseFloat(u.balance || 0).toFixed(2)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openAdminModal() {
      if (currentUser && currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        document.getElementById('adminPanelModal').classList.remove('hidden');
      } else {
        alert('Access denied.');
      }
    }

    function switchTab(tabName) {
      ['dashboardTab', 'referralTab'].forEach(t => document.getElementById(t).classList.add('hidden'));
      document.getElementById(tabName + 'Tab').classList.remove('hidden');
    }

    function openAuthModal() { document.getElementById('authModal').classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function switchAuthTab(type) {
      if (type === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('signupForm').classList.add('hidden');
      } else {
        document.getElementById('signupForm').classList.remove('hidden');
        document.getElementById('loginForm').classList.add('hidden');
      }
    }
    function copyRefLink() {
      navigator.clipboard.writeText(document.getElementById('refLinkInput').value);
      alert('Copied referral link!');
    }
  </script>
</body>
</html>
