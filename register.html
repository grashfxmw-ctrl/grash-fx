<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111e"><title>GRASH FX — Create Account</title>
<style>
:root{color-scheme:dark;--bg:#07111e;--panel:#101f30;--line:#38516a;--text:#f7f9fc;--muted:#aebed0;--gold:#f0b94f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#193b56 0,var(--bg) 65%);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:22px}.card{width:min(100%,470px);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 24px 80px #0008}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.brand img{width:58px;height:58px;object-fit:contain}.brand strong{display:block;letter-spacing:.12em;color:var(--gold);font-size:20px}.brand small,.muted{color:var(--muted);font-size:12px}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:27px;margin:5px 0 4px}.field{margin:16px 0}.field label{display:block;font-size:13px;color:#dce7f4;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #40536a;border-radius:10px;background:#081522;color:white;font:inherit;outline:none}.field input:focus{border-color:var(--gold)}.phone-control{display:flex;gap:8px;align-items:stretch}.country-wrap{position:relative;flex:0 0 132px}.country-button{height:100%;min-height:49px;width:100%;padding:8px;border:1px solid #40536a;border-radius:10px;background:#081522;color:white;font:inherit;text-align:left;cursor:pointer}.country-menu{display:none;position:absolute;z-index:20;top:calc(100% + 7px);left:0;width:260px;max-height:270px;overflow:auto;padding:8px;background:#102236;border:1px solid #526a82;border-radius:12px;box-shadow:0 16px 35px #0009}.country-menu.open{display:block}.country-search{width:100%;padding:10px;border:1px solid #40536a;border-radius:8px;background:#071522;color:white;margin-bottom:7px}.country-option{display:block;width:100%;padding:9px;border:0;border-radius:7px;background:transparent;color:#f7f9fc;text-align:left;cursor:pointer}.country-option:hover{background:#29445d}.phone-input{min-width:0;flex:1}.phone-input input{height:100%}.submit{width:100%;padding:13px;border:0;border-radius:10px;background:var(--gold);color:#101820;font-weight:850;font-size:14px;cursor:pointer;margin-top:8px}.submit:disabled{opacity:.6}.message{margin-top:14px;padding:11px;border:1px solid #40536a;border-radius:9px;background:#081522;color:#dce7f4;font-size:13px;white-space:pre-wrap}.switch{margin-top:18px;text-align:center;color:var(--muted);font-size:13px}.switch a,.forgot{color:var(--gold);font-weight:700}.forgot{display:inline-block;margin:0 0 8px;font-size:13px}.back{display:inline-block;margin-top:18px;color:var(--muted);font-size:13px}.hidden{display:none!important}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/libphonenumber-js@1.11.20/bundle/libphonenumber-js.min.js"></script></head><body>
<main class="card"><a class="brand" href="./" aria-label="GRASH FX home"><img src="assets/grash-fx-logo.svg" alt=""><span><strong>GRASH FX</strong><small>LIVE MARKET DATA</small></span></a>
<div class="eyebrow">CREATE YOUR ACCOUNT</div><h1>Welcome to GRASH FX</h1><p class="muted">SUBWelcome to GRASH FX</p>
<form id="authForm">
<div class="field"><label for="fullName">Full name</label><input id="fullName" minlength="2" maxlength="100" autocomplete="name" placeholder="Enter your full name" required></div>
<div class="field"><label>Phone number</label><div class="phone-control"><div class="country-wrap"><button id="countryButton" class="country-button" type="button" aria-label="Choose country code"></button><div id="countryMenu" class="country-menu"><input id="countrySearch" class="country-search" placeholder="Search country or code"><div id="countryOptions"></div></div></div><div class="phone-input"><input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="Enter phone number" required></div></div><small class="muted">Country suggestion is based on your device settings. You can change it.</small></div>
<div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="Enter your email" required></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required></div>
<div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Confirm your password" required></div>
<button class="submit" type="submit">CREATE ACCOUNT</button></form>
<div id="message" class="message" role="status" aria-live="polite">Ready.</div>
<p class="switch">Already have an account? <a href="login.html">Sign in</a></p><a class="back" href="./">← Back to homepage</a></main>
<script>
(()=>{const URL="https://vwghcjkgzeausfxqphmf.supabase.co",KEY="sb_publishable_gn3ndWb6xAtoaZ4FYFaHug_sbnCJI33",API=URL+"/functions/v1/account-api",sb=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);
const countries=[{iso:"MW",code:"+265",flag:"🇲🇼",name:"Malawi"},{iso:"TZ",code:"+255",flag:"🇹🇿",name:"Tanzania"},{iso:"ZA",code:"+27",flag:"🇿🇦",name:"South Africa"},{iso:"ZW",code:"+263",flag:"🇿🇼",name:"Zimbabwe"},{iso:"BW",code:"+267",flag:"🇧🇼",name:"Botswana"},{iso:"MZ",code:"+258",flag:"🇲🇿",name:"Mozambique"}];
let selected=countries[0];const message=(t)=>$("message").textContent=t;
const regionMap={MW:"MW",TZ:"TZ",ZA:"ZA",ZW:"ZW",BW:"BW",MZ:"MZ"};
try{const region=new Intl.Locale(navigator.language).region,zone=Intl.DateTimeFormat().resolvedOptions().timeZone;const zones={"Africa/Blantyre":"MW","Africa/Dar_es_Salaam":"TZ","Africa/Johannesburg":"ZA","Africa/Harare":"ZW","Africa/Gaborone":"BW","Africa/Maputo":"MZ"};const iso=regionMap[region]||zones[zone];if(iso)selected=countries.find(c=>c.iso===iso)||selected;}catch(_){}
function renderCountry(){ $("countryButton").textContent=selected.flag+" "+selected.code+" ▾"; }
renderCountry();
$("countryButton").addEventListener("click",()=>{$("countryMenu").classList.toggle("open");$("countrySearch").value="";filterCountries();$("countrySearch").focus();});
function filterCountries(){const q=$("countrySearch").value.toLowerCase();$("countryOptions").innerHTML="";countries.filter(c=>(c.name+" "+c.code).toLowerCase().includes(q)).forEach(c=>{const b=document.createElement("button");b.type="button";b.className="country-option";b.textContent=c.flag+"  "+c.name+" ("+c.code+")";b.onclick=()=>{selected=c;renderCountry();$("countryMenu").classList.remove("open");};$("countryOptions").appendChild(b);});}
$("countrySearch").addEventListener("input",filterCountries);
document.addEventListener("click",e=>{if(!$("countryMenu").contains(e.target)&&e.target!==$("countryButton"))$("countryMenu").classList.remove("open");});
function e164(){const raw=$("phone").value.trim();if(!raw)throw Error("Enter your phone number.");let parsed;if(window.libphonenumber?.parsePhoneNumberFromString){parsed=window.libphonenumber.parsePhoneNumberFromString(raw,selected.iso);if(!parsed||!parsed.isValid())throw Error("Enter a valid "+selected.name+" phone number.");return parsed.number;}const digits=raw.replace(/\D/g,"").replace(/^0+/,"");const full=selected.code+digits;if(!/^\+[1-9]\d{7,14}$/.test(full))throw Error("Enter a valid phone number for the selected country.");return full;}
async function enterDashboard(){const {data:{session}}=await sb.auth.getSession();if(!session?.user)throw Error("Please sign in again.");const r=await fetch(API+"/me",{headers:{Authorization:"Bearer "+session.access_token,apikey:KEY}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Could not load your account.");if(!d.profile)throw Error("Your client profile is not ready. Please contact support; do not register again.");if(d.profile.status==="active"){message("Signed in. Opening your dashboard…");location.href="client-dashboard.html";}else message("Your account status is "+d.profile.status+". Contact GRASH FX support if you need help.");}
const referral=(new URLSearchParams(location.search).get("ref")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,9);
$("authForm").addEventListener("submit",async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const phone=e164(),password=$("password").value;if(password!==$("confirmPassword").value)throw Error("The passwords do not match.");const {data,error}=await sb.auth.signUp({email:$("email").value.trim(),password,options:{emailRedirectTo:"https://grashfxmw-ctrl.github.io/grash-fx/",data:{full_name:$("fullName").value.trim(),phone,country_code:selected.iso,referral_code:referral}}});if(error)throw error;if(data.session){message("Account created. Opening your dashboard…");await enterDashboard();}else{message("Your account has been created. Please sign in using your email and password.");setTimeout(()=>location.href="login.html",1200);}}catch(err){message(err.message||"Registration failed.");}finally{b.disabled=false;}});
})();
</script></body></html>
